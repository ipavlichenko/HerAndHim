services:
  sara:
    image: herandhim-sara:pilot
    container_name: sara-pilot
    restart: unless-stopped
    user: "10001:10001"
    environment:
      TZ: Europe/Moscow
    ports:
      - "127.0.0.1:7788:7788"
    volumes:
      - /srv/sara/data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1400m
    cpus: 1.75
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7788/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

